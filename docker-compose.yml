services:
  web:
    build: .  
    container_name: tcc-informatica
    ports:
      - "8080:80"
    volumes:
      - "./src:/var/www/html"
    restart: always
    depends_on:
      - db
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_PORT=${SMTP_PORT}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

  db:
    image: mariadb:10.6
    container_name: banco-tcc-informatica
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: tccjocelino
      MYSQL_USER: admin
      MYSQL_PASSWORD: 123456
      TZ: America/Sao_Paulo 
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./src/database/tccjocelino.sql:/docker-entrypoint-initdb.d/tccjocelino.sql
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-tcc
    restart: always
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root123

volumes:
  db_data: